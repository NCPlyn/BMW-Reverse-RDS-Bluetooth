; ESP32 Bluetooth speaker (A2DP sink -> EQ -> PCM5102)
; Pinned to Arduino-ESP32 core 2.0.x because the sketch uses the legacy driver/i2s.h API.

[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Two 1.9 MB app slots so ElegantOTA can update over WiFi
board_build.partitions = min_spiffs.csv

lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git
    https://github.com/pschatzmann/arduino-audio-tools.git
    adafruit/Adafruit ADS1X15@^2.5.0
    ayushsharma82/ElegantOTA@^3.1.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
